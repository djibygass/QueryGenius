<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query Generator</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>SQL Query Generator</h1>
    <button onclick="location.href='/?mode=query'">SQL Query</button>
    <button onclick="location.href='/?mode=schema'">Database Connection</button>

    {% if mode == 'query' %}
    <form method="post">
        <div>
            <label for="db_schema">Enter Database Schema (optional):</label>
            <input type="text" id="db_schema" name="db_schema" class="prompt-input" value="{{ db_schema }}">
        </div>
        <div>
            <label for="sql_dialect">Choose SQL Dialect:</label>
            <select id="sql_dialect" name="sql_dialect" class="prompt-input">
                <option value="Standard SQL">Standard SQL</option>
                <option value="PostgreSQL">PostgreSQL</option>
                <option value="MySQL">MySQL</option>
                <option value="BigQuery">BigQuery</option>
                <option value="Snowflake">Snowflake</option>
            </select>
        </div>
        <div>
            <label for="prompt">Enter your prompt:</label>
            <input type="text" id="prompt" name="prompt" class="prompt-input" required>
        </div>
        <button type="submit" name="action" value="generate_sql">Generate SQL Query</button>
    </form>
    {% elif mode == 'schema' %}
    <form method="post">
        <div>
            <label for="rds_endpoint">RDS Endpoint:</label>
            <input type="text" id="rds_endpoint" name="rds_endpoint" required>
        </div>
        <div>
            <label for="db_name">Database Name:</label>
            <input type="text" id="db_name" name="db_name" required>
        </div>
        <div>
            <label for="table_name">Table Name:</label>
            <input type="text" id="table_name" name="table_name" required>
        </div>
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" name="action" value="fetch_schema">Fetch Table Schema</button>
    </form>
    {% endif %}

    {% if sql_query %}
    <h2>Generated SQL Query:</h2>
    <pre>{{ sql_query }}</pre>
    {% elif table_schema %}
    <h2>Table Schema Retrieved Successfully!</h2>
    <pre>{{ table_schema }}</pre>
    {% endif %}
</body>
</html>
